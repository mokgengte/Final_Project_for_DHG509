<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>去中心化追蹤Demo</title>
  <style>
    :root {
      --bg: #edf6f2;
      --bg2: #d8ecf0;
      --card: #ffffff;
      --ink: #13252c;
      --muted: #5a6b72;
      --accent: #0f766e;
      --accent2: #0e7490;
      --line: #d7e2e8;
      --good: #0ea5a1;
      --warn: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(circle at 5% 10%, #ffffffaa 0 8%, transparent 9%),
        radial-gradient(circle at 94% 2%, #ffffffaa 0 7%, transparent 8%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      padding: 24px;
    }

    .wrap {
      max-width: 1220px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
      grid-template-columns: 1.05fr 0.95fr;
    }

    .card {
      background: var(--card);
      border: 1px solid #ffffff8f;
      border-radius: 16px;
      box-shadow: 0 10px 26px #0f172a14;
      padding: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 32px);
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .guide-controls {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .upload-option {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 2px solid #7ac9d8;
      border-radius: 12px;
      background: linear-gradient(135deg, #f6fdff, #e8f8fb);
      font-size: 16px;
      font-weight: 800;
      color: #0f4c5c;
      box-shadow: 0 8px 18px #0f766e22;
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      cursor: pointer;
    }

    .upload-option:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px #0f766e2b;
      border-color: #38bdf8;
    }

    .upload-option input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #0284c7;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .upload-option:has(input:checked) {
      border-color: #0ea5a1;
      background: linear-gradient(135deg, #ecfeff, #ccfbf1);
      box-shadow: 0 10px 24px #0f766e2e;
    }

    .narration {
      margin-top: 10px;
      border: 2px solid #7ac9d8;
      border-radius: 12px;
      padding: 14px;
      background: linear-gradient(135deg, #f4fbfc, #e8f8fb);
      color: #0f4c5c;
      font-size: clamp(16px, 2.1vw, 22px);
      line-height: 1.45;
      font-weight: 800;
      box-shadow: 0 8px 18px #0f766e22;
    }

    .narration.no-wrap {
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.02em;
      background: var(--accent);
    }

    button.alt { background: #334155; }
    button.warn { background: #b91c1c; }

    .stage {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      height: 360px;
      position: relative;
      background:
        linear-gradient(transparent 95%, #96b5c255 95%),
        linear-gradient(90deg, transparent 95%, #96b5c255 95%),
        linear-gradient(#f5fbff, #ecf6fa);
      background-size: 42px 42px, 42px 42px, auto;
      overflow: hidden;
    }

    .device {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 20px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      transition: left .72s ease, top .72s ease, box-shadow .2s ease;
      box-shadow: 0 8px 20px #0f172a2d;
    }

    .phone { background: #0284c7; }
    .infected { background: #dc2626; }

    .tempid {
      position: absolute;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 11px;
      color: #334155;
      transform: translate(-50%, -140%);
      white-space: nowrap;
      box-shadow: 0 8px 16px #0f172a14;
    }

    .pulse {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid #0f766e44;
      transform: translate(-50%, -50%);
      animation: ping 1.1s ease-out infinite;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes ping {
      from { transform: translate(-50%, -50%) scale(.5); opacity: .9; }
      to { transform: translate(-50%, -50%) scale(1.05); opacity: 0; }
    }

    .cols {
      display: grid;
      gap: 12px;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #fcfeff;
    }

    .kpi {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chip {
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid #cfe3ea;
      background: #edf8fb;
      padding: 4px 9px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 5px;
      text-align: left;
    }

    .state {
      font-weight: 700;
      border-radius: 999px;
      color: #fff;
      padding: 4px 10px;
      display: inline-block;
      font-size: 12px;
    }

    .state.local { background: var(--good); }
    .state.upload { background: var(--warn); }

    .risk-code {
      display: inline-flex;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      min-width: 62px;
      justify-content: center;
    }

    .risk-code.green { background: #16a34a; }
    .risk-code.yellow { background: #f59e0b; }
    .risk-code.red { background: #dc2626; }

    .transition {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .step {
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f6fbfd;
      color: #64748b;
      padding: 4px 9px;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }

    .step.active {
      background: #fff7ed;
      color: #9a3412;
      border-color: #fdba74;
    }

    .step.done {
      background: #ecfeff;
      color: #0f766e;
      border-color: #99f6e4;
    }

    @media (max-width: 980px) {
      .wrap { grid-template-columns: 1fr; }
      .stage { height: 320px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>去中心化追蹤Demo</h1>
      <p class="sub">以步驟控制演示：本機記錄接觸事件 → 復核更新 → 接觸者由黃碼轉紅碼。</p>

      <div class="guide-controls">
        <label class="upload-option" for="uploadToggle">
          <input id="uploadToggle" type="checkbox" checked />
          使用者 A 上傳確診狀態
        </label>
      </div>

      <div id="guideText" class="narration">演示已停在步驟 1。請使用步驟控制進行展示。</div>

      <div class="controls">
        <div class="manual-control">
          <label for="scenarioStep" style="font-size:13px; font-weight:700;">手動步驟控制: <strong id="scenarioStepValue">1/6</strong></label>
          <input id="scenarioStep" type="range" min="1" max="6" step="1" value="1" />
        </div>
        <div class="manual-control" style="display:flex; gap:8px;">
          <button id="prevScene">上一步</button>
          <button id="nextScene">下一步</button>
          <button id="resetScene" class="alt">重置演示</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="device infected" id="devA" style="left:20%; top:45%;">A</div>
        <div class="device phone" id="devB" style="left:72%; top:32%;">B</div>

        <div class="tempid" id="idA" style="left:20%; top:45%;"></div>
        <div class="tempid" id="idB" style="left:72%; top:32%;"></div>
      </div>
    </section>

    <aside class="cols">
      <section class="card box">
        <h3 style="margin:0;">當前狀態</h3>
        <div style="margin-top:8px; font-size:13px;">當前步驟: <strong id="sceneBadge">1/6</strong></div>
        <div style="margin-top:6px;">資料位置: <span id="stateTag" class="state local">僅在個人裝置</span></div>
        <div style="margin-top:6px; font-size:13px;">B 使用者風險碼: <span id="riskCodeB" class="risk-code green">綠碼</span></div>
        <div class="transition">
          <span id="rb1" class="step">1. 命中接觸事件</span>
          <span id="rb2" class="step">2. 上傳與中央解密</span>
          <span id="rb3" class="step">3. 通知並轉紅碼</span>
        </div>
        <div class="kpi">
          <span class="chip">定位來源: 藍牙訊號強度（RSSI）</span>
        </div>
        <p id="hint" style="font-size:15px; color:#334155; margin-top:10px; line-height:1.55; font-weight:700;">
          尚未上傳。MOH 伺服器只知道 TempID 對照規則，尚不知道誰接觸過誰。
        </p>
      </section>

      <section class="card box">
        <h3 style="margin:0 0 8px;">A 裝置本地接觸紀錄（上限顯示 8 筆）</h3>
        <table>
          <thead>
            <tr><th>時間</th><th>對方 TempID</th><th>藍牙訊號強度（RSSI）</th><th>接觸分鐘</th></tr>
          </thead>
          <tbody id="localLog"></tbody>
        </table>
      </section>

      <section class="card box">
        <h3 style="margin:0 0 8px;">衛生部門通知名單與狀態</h3>
        <table>
          <thead>
            <tr><th>接觸者</th><th>追蹤程序</th><th>通知狀態</th></tr>
          </thead>
          <tbody id="serverLog"></tbody>
        </table>
      </section>
    </aside>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const el = {
      A: document.getElementById("devA"),
      B: document.getElementById("devB")
    };
    const idEl = {
      A: document.getElementById("idA"),
      B: document.getElementById("idB")
    };

    const sceneBadge = document.getElementById("sceneBadge");
    const stateTag = document.getElementById("stateTag");
    const guideText = document.getElementById("guideText");
    const uploadToggle = document.getElementById("uploadToggle");
    const scenarioStep = document.getElementById("scenarioStep");
    const scenarioStepValue = document.getElementById("scenarioStepValue");
    const riskCodeB = document.getElementById("riskCodeB");
    const riskSteps = ["rb1", "rb2", "rb3"].map(id => document.getElementById(id));
    const hint = document.getElementById("hint");
    const localLog = document.getElementById("localLog");
    const serverLog = document.getElementById("serverLog");

    let step = 0;
    let uploaded = false;
    let currentSceneIndex = 0;
    let allowUpload = true;

    const scenes = [
      { ticks: 0, upload: false, text: "步驟 1/6：初始狀態，所有資料在本機，接觸者維持綠碼。" },
      { ticks: 2, upload: false, text: "步驟 2/6：裝置交換 TempID，接觸事件寫入本機。" },
      { ticks: 3, upload: false, forceLevel: "yellow", text: "步驟 3/6：命中接觸事件，接觸者進入黃碼預警。" },
      { ticks: 4, upload: false, forceLevel: "yellow", text: "步驟 4/6：覆核階段進行中，接觸者維持黃碼。" },
      { ticks: 5, upload: true, forceLevel: "red", text: "步驟 5/6：復核後更新信息，接觸者由黃碼轉為紅碼。", textNoUpload: "步驟 5/6：A 未上傳確診狀態，接觸者維持綠碼。" },
      { ticks: 6, upload: true, forceLevel: "red", text: "步驟 6/6：接觸者無警告，無法進一步處置。", textNoUpload: "步驟 6/6：仍未上傳，系統無法完成通知，接觸者維持綠碼。" }
    ];

    const logs = {
      A: [], B: []
    };

    const serverTempToUser = {};

    function randomTemp(prefix, seed) {
      const base = (seed * 9301 + 49297) % 233280;
      return `${prefix}-${base.toString(16).padStart(5, "0")}`;
    }

    function rotateTempIDs() {
      const slotSeed = step + 1;
      ["A", "B"].forEach((d, i) => {
        const t = randomTemp(d, slotSeed * (i + 7));
        serverTempToUser[t] = d;
        idEl[d].textContent = `TempID: ${t}`;
      });
    }

    function positionsForStep(n) {
      const pattern = [
        { A: [18, 34], B: [82, 28] },
        { A: [24, 40], B: [76, 24] },
        { A: [32, 46], B: [68, 28] },
        { A: [48, 50], B: [54, 46] },
        { A: [48, 56], B: [54, 44] },
        { A: [56, 54], B: [50, 50] },
        { A: [62, 48], B: [46, 54] },
        { A: [66, 42], B: [42, 56] },
        { A: [62, 46], B: [46, 50] },
        { A: [56, 52], B: [50, 44] },
        { A: [48, 56], B: [54, 40] },
        { A: [40, 54], B: [60, 36] }
      ];
      return pattern[n % pattern.length];
    }

    function setPositions(map) {
      ["A", "B"].forEach(d => {
        const [x, y] = map[d];
        el[d].style.left = `${x}%`;
        el[d].style.top = `${y}%`;
        idEl[d].style.left = `${x}%`;
        idEl[d].style.top = `${y}%`;
      });
    }

    function distanceOnMap(map, a, b) {
      const [ax, ay] = map[a];
      const [bx, by] = map[b];
      return Math.hypot(ax - bx, ay - by);
    }

    function addPulse(x, y) {
      const p = document.createElement("div");
      p.className = "pulse";
      p.style.left = `${x}%`;
      p.style.top = `${y}%`;
      stage.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }

    function handshake(a, b) {
      const tA = idEl[a].textContent.replace("TempID: ", "");
      const tB = idEl[b].textContent.replace("TempID: ", "");
      const rssi = -45 - Math.round(Math.random() * 25);
      const mins = 2 + Math.round(Math.random() * 10);
      const stamp = `步驟${currentSceneIndex + 1}`;

      logs[a].push({ ts: stamp, peer: tB, rssi, mins, day: 1 });
      logs[b].push({ ts: stamp, peer: tA, rssi, mins, day: 1 });

      const ax = parseFloat(el[a].style.left);
      const ay = parseFloat(el[a].style.top);
      addPulse(ax, ay);
    }

    function pruneOldLogs() {
      const now = 1;
      ["A", "B"].forEach(d => {
        logs[d] = logs[d].filter(r => now - r.day < 21);
      });
    }

    function renderTables() {
      const top = logs.A.slice(-8).reverse();
      localLog.innerHTML = top.length
        ? top.map(r => `<tr><td>${r.ts}</td><td>${r.peer}</td><td>${r.rssi} dBm（分貝毫瓦）</td><td>${r.mins}</td></tr>`).join("")
        : '<tr><td colspan="4">尚無接觸紀錄</td></tr>';
    }

    function tick() {
      step += 1;
      const posMap = positionsForStep(step);

      rotateTempIDs();
      setPositions(posMap);

      const pairs = [["A", "B"]];
      pairs.forEach(([x, y]) => {
        if (distanceOnMap(posMap, x, y) < 14) handshake(x, y);
      });

      pruneOldLogs();
      renderTables();
    }

    function resetRiskTransition() {
      riskSteps.forEach(s => s.classList.remove("active", "done"));
    }

    function setRiskCode(level, text) {
      riskCodeB.className = `risk-code ${level}`;
      riskCodeB.textContent = text;
    }

    function runBCodeTransition(contactedB) {
      resetRiskTransition();
      setRiskCode("green", "綠碼");

      if (!contactedB) {
        hint.textContent = "A 已上傳，但 B 未被解密為近距接觸者，維持綠碼。";
        return;
      }

      riskSteps[0].classList.add("done");
      riskSteps[1].classList.add("done");
      riskSteps[2].classList.add("done");
      setRiskCode("red", "紅碼");
      hint.textContent = "中央完成解密與通知，接觸者風險碼已更新為紅碼。";
    }

    function uploadFromA() {
      uploaded = true;
      stateTag.className = "state upload";
      stateTag.textContent = "確診後上傳解密";
      hint.textContent = "MOH 取得 A 的本地加密紀錄後，透過 TempID 對照解密接觸者並發送通知。";

      if (!logs.A.length) {
        const seedPeer = idEl.B.textContent.replace("TempID: ", "");
        logs.A.push({ ts: `步驟${currentSceneIndex + 1}`, peer: seedPeer, rssi: -58, mins: 8, day: 1 });
      }

      const contacts = new Set();
      logs.A.forEach(r => {
        const real = serverTempToUser[r.peer];
        if (real && real !== "A") contacts.add(real);
      });

      const rows = contacts.has("B")
        ? ['<tr><td>B 使用者</td><td>追蹤程序</td><td>已通知採檢 / 觀察</td></tr>']
        : [];

      serverLog.innerHTML = rows.length
        ? rows.join("")
        : '<tr><td colspan="3">無可解密接觸者</td></tr>';

      runBCodeTransition(contacts.has("B"));
      renderTables();
    }

    function resetStateOnly() {
      step = 0;
      uploaded = false;
      ["A", "B"].forEach(d => logs[d] = []);
      for (const k in serverTempToUser) delete serverTempToUser[k];
      serverLog.innerHTML = '<tr><td colspan="3">尚未上傳資料</td></tr>';
      stateTag.className = "state local";
      stateTag.textContent = "僅在個人裝置";
      resetRiskTransition();
      setRiskCode("green", "綠碼");
      hint.textContent = "尚未上傳。MOH 伺服器只知道 TempID 對照規則，尚不知道誰接觸過誰。";
      rotateTempIDs();
      setPositions(positionsForStep(0));
      renderTables();
    }

    function setRiskFlowByScene(sceneIndex) {
      resetRiskTransition();
      if (!allowUpload) {
        setRiskCode("green", "綠碼");
        hint.textContent = "A 未上傳確診狀態，中央無法解密與通知，B 維持綠碼。";
        return;
      }

      if (sceneIndex <= 1) {
        setRiskCode("green", "綠碼");
        hint.textContent = "尚未上傳。MOH 伺服器只知道 TempID 對照規則，尚不知道誰接觸過誰。";
        return;
      }
      if (sceneIndex === 2) {
        riskSteps[0].classList.add("active");
        setRiskCode("yellow", "黃碼");
        hint.textContent = "已命中接觸事件，接觸者進入預警。";
        return;
      }
      if (sceneIndex === 3) {
        riskSteps[0].classList.add("done");
        riskSteps[1].classList.add("active");
        setRiskCode("yellow", "黃碼");
        hint.textContent = "平台覆核中，接觸者維持黃碼。";
        return;
      }

      riskSteps[0].classList.add("done");
      riskSteps[1].classList.add("done");
      riskSteps[2].classList.add("done");
      setRiskCode("red", "紅碼");
      hint.textContent = "覆核完成並通知，接觸者為紅碼。";
    }

    function applyScene(sceneIndex) {
      const max = scenes.length - 1;
      currentSceneIndex = Math.max(0, Math.min(sceneIndex, max));
      scenarioStep.max = String(scenes.length);
      scenarioStep.value = String(currentSceneIndex + 1);
      scenarioStepValue.textContent = `${currentSceneIndex + 1}/${scenes.length}`;
      sceneBadge.textContent = `${currentSceneIndex + 1}/${scenes.length}`;

      const scene = scenes[currentSceneIndex];
      resetStateOnly();
      for (let i = 0; i < scene.ticks; i++) tick();
      if (scene.upload && allowUpload) uploadFromA();

      if (!allowUpload && scene.upload) {
        stateTag.className = "state local";
        stateTag.textContent = "僅在個人裝置";
        serverLog.innerHTML = '<tr><td colspan="3">A 未上傳，中央無法解密通知</td></tr>';
      }

      setRiskFlowByScene(currentSceneIndex);
      guideText.textContent = (!allowUpload && scene.upload && scene.textNoUpload) ? scene.textNoUpload : scene.text;
      guideText.classList.toggle("no-wrap", currentSceneIndex === 4);
    }

    scenarioStep.addEventListener("input", () => {
      applyScene(Number(scenarioStep.value) - 1);
    });
    document.getElementById("prevScene").addEventListener("click", () => {
      applyScene(currentSceneIndex - 1);
    });
    document.getElementById("nextScene").addEventListener("click", () => {
      applyScene(currentSceneIndex + 1);
    });
    document.getElementById("resetScene").addEventListener("click", () => {
      applyScene(0);
    });
    uploadToggle.addEventListener("change", () => {
      allowUpload = uploadToggle.checked;
      applyScene(currentSceneIndex);
    });
    applyScene(0);
  </script>
</body>
</html>
